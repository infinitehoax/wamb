name: Compile Android APK

on:
  workflow_dispatch:
    description: "Manual trigger to compile the Android app-debug APK"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Display Artifact Link
        run: |
          echo "### APK Artifact Link" >> $GITHUB_STEP_SUMMARY
          echo "You can download the generated debug APK here: [Download app-debug.apk](${{ steps.upload-apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
